name: Deploy Bible Quotes Widget

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Build Web
        # Εδώ χτίζουμε το project. 
        # Αν είναι Flutter: flutter build web
        # Αν είναι Dart Web: webdev build ή dart compile js
        run: dart compile js bin/main.dart -o build/main.js

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: bible-quotes-widget 
          directory: build
